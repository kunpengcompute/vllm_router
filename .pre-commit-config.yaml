minimum_pre_commit_version: 4.0.0
exclude: ^LICENSE|^docs/|\.(md|html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]  # 兼容K8S
        exclude: mkdocs\.yml$  # !!python/name: 标签不兼容 safe_load
      - id: check-toml               # 校验 TOML 文件语法（pyproject.toml）
      - id: check-added-large-files  # 拦截超大文件提交（默认500KB）
      - id: check-merge-conflict     # 检测未解决的合并冲突（<<<<<<< HEAD）
      - id: detect-private-key       # 检测硬编码的私钥/密钥
      - id: check-json

# Python 代码格式化和静态检查
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix"]
